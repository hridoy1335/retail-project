# This is a Databricks asset bundle definition for retail_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: retail_project
  uuid: be82a66d-b020-4702-ae7a-0404944f16ea

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-f5635c5f-848f.cloud.databricks.com
    variables:
      catalog: retail_dev
      schema: bronze
  qa:
    mode: production
    workspace:
      host: https://dbc-565e2d8b-e807.cloud.databricks.com$0
      # We explicitly deploy to /Workspace/Users/rkhridoyinfo@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/rkhridoyinfo@gmail.com/.bundle/qa/${bundle.name}/${bundle.target}
    variables:
      catalog: retail_qa
      schema: bronze
    permissions:
      - user_name: hridoykinfo@gmail.com
        level: CAN_MANAGE

  prod:
    mode: production
    workspace:
      host: https://dbc-3485f9b3-a875.cloud.databricks.com$0
      # We explicitly deploy to /Workspace/Users/rkhridoyinfo@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/rkhridoyinfo@gmail.com/.bundle/prod/${bundle.name}/${bundle.target}
    variables:
      catalog: retail_prod
      schema: bronze
    permissions:
      - user_name: hridoinfo@gmail.com
        level: CAN_MANAGE
